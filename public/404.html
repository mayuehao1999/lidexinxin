<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>页面跳转中…</title>
    <script type="text/javascript">
      var l = window.location
      var repo = 'lidexinxin'
      var parts = l.pathname.split('/')
      var pathSegmentsToKeep = parts[1] === repo ? 1 : 0
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        parts.slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.substr(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.substr(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
